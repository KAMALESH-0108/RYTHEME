version: '3.8'

services:
  # ============================================================================
  # Unified Production Service (Serves API Engine, Express API & Flutter Web UI)
  # ============================================================================
  rytheme-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rytheme_unified
    restart: always
    ports:
      - "${PORT:-5000}:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - SUPABASE_URL=${SUPABASE_URL:-https://dpnxxrmvahyfzpfwhrey.supabase.co}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRwbnh4cm12YWh5ZnpwZndocmV5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc3MDU2MDgsImV4cCI6MjEwMzI4MTYwOH0.IfsjEJNJ1GQTFluzdhf3ccc3xb-1voAJTJpYX4krmVY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRwbnh4cm12YWh5ZnpwZndocmV5Iiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc4NzcwNTYwOCwiZXhwIjoyMTAzMjgxNjA4fQ.s7jfi3mOHmM-bbz9CcRKFXZytL7Uz6xQRZccdyWGDpc}
      - JIOSAAVN_API_URL=http://localhost:3000
      - CORS_ORIGIN=*
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
