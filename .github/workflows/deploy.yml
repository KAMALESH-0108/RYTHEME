
name: RYTHEME Full-Stack CI/CD Deployment

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:


# ============================================================================
# GLOBAL CONFIGURATION
# ============================================================================

env:
  NODE_VERSION: "20"
  FLUTTER_CHANNEL: stable
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}


# ============================================================================
# CONCURRENCY
# ============================================================================

concurrency:
  group: rytheme-${{ github.ref }}
  cancel-in-progress: true


# ============================================================================
# JOBS
# ============================================================================

jobs:

  # ==========================================================================
  # JOB 1 — FLUTTER + API + BACKEND BUILD & TEST
  # ==========================================================================

  build-and-test:

    name: 🔍 Test & Build Frontend, Backend and API

    runs-on: ubuntu-latest

    steps:

      # ----------------------------------------------------------------------
      # CHECKOUT
      # ----------------------------------------------------------------------

      - name: 📥 Check out repository
        uses: actions/checkout@v4


      # ----------------------------------------------------------------------
      # FLUTTER SETUP
      # ----------------------------------------------------------------------

      - name: 🎯 Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true


      # ----------------------------------------------------------------------
      # FLUTTER DEPENDENCIES
      # ----------------------------------------------------------------------

      - name: 📦 Install Flutter Dependencies
        run: flutter pub get


      # ----------------------------------------------------------------------
      # FLUTTER ANALYSIS
      # ----------------------------------------------------------------------

      - name: 🔍 Analyze Flutter Code
        run: flutter analyze --no-fatal-infos


      # ----------------------------------------------------------------------
      # FLUTTER TESTS
      # ----------------------------------------------------------------------

      - name: 🧪 Run Flutter Tests
        run: flutter test


      # ----------------------------------------------------------------------
      # FLUTTER WEB BUILD
      # ----------------------------------------------------------------------

      - name: 🏗️ Build Flutter Web
        run: flutter build web --release


      # ----------------------------------------------------------------------
      # NODE.JS SETUP
      # ----------------------------------------------------------------------

      - name: 🟢 Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            jiosaavn-api/package-lock.json
            backend/package-lock.json


      # ----------------------------------------------------------------------
      # JIOSAAVN API
      # ----------------------------------------------------------------------

      - name: 📦 Install JioSaavn API Dependencies
        working-directory: ./jiosaavn-api
        run: npm ci


      - name: 🧪 Test JioSaavn API
        working-directory: ./jiosaavn-api
        run: npm test --if-present


      - name: 🏗️ Build JioSaavn API
        working-directory: ./jiosaavn-api
        run: npm run build --if-present


      # ----------------------------------------------------------------------
      # EXPRESS BACKEND
      # ----------------------------------------------------------------------

      - name: 📦 Install Backend Dependencies
        working-directory: ./backend
        run: npm ci


      - name: 🧪 Run Backend Tests
        working-directory: ./backend
        run: npm test --if-present


      # ----------------------------------------------------------------------
      # BACKEND SYNTAX CHECK
      # ----------------------------------------------------------------------

      - name: 🔍 Verify Backend Syntax
        working-directory: ./backend
        run: node --check server.js


      # ----------------------------------------------------------------------
      # BUILD SUMMARY
      # ----------------------------------------------------------------------

      - name: ✅ Build Validation Complete
        run: |
          echo "=============================================="
          echo "       RYTHEME BUILD VALIDATION"
          echo "=============================================="
          echo "✅ Flutter dependencies installed"
          echo "✅ Flutter analysis completed"
          echo "✅ Flutter tests completed"
          echo "✅ Flutter Web build completed"
          echo "✅ JioSaavn API validated"
          echo "✅ Backend validated"
          echo "=============================================="


  # ==========================================================================
  # JOB 2 — DOCKER BUILD & PUSH TO GHCR
  # ==========================================================================

  deploy-docker:

    name: 🐳 Build & Publish Docker Image

    needs: build-and-test

    if: >
      github.event_name == 'push' &&
      (
        github.ref == 'refs/heads/main' ||
        github.ref == 'refs/heads/master'
      )

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:

      # ----------------------------------------------------------------------
      # CHECKOUT
      # ----------------------------------------------------------------------

      - name: 📥 Check out repository
        uses: actions/checkout@v4


      # ----------------------------------------------------------------------
      # DOCKER BUILDX
      # ----------------------------------------------------------------------

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3


      # ----------------------------------------------------------------------
      # LOGIN TO GHCR
      # ----------------------------------------------------------------------

      - name: 🔐 Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      # ----------------------------------------------------------------------
      # DOCKER IMAGE METADATA
      # ----------------------------------------------------------------------

      - name: 🏷️ Generate Docker Image Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short
            type=ref,event=branch


      # ----------------------------------------------------------------------
      # BUILD & PUSH IMAGE
      # ----------------------------------------------------------------------

      - name: 🚀 Build and Push Docker Image
        uses: docker/build-push-action@v6

        with:
          context: .
          file: ./Dockerfile

          push: true

          tags: ${{ steps.meta.outputs.tags }}

          labels: ${{ steps.meta.outputs.labels }}

          cache-from: type=gha
          cache-to: type=gha,mode=max


      # ----------------------------------------------------------------------
      # DOCKER SUCCESS
      # ----------------------------------------------------------------------

      - name: ✅ Docker Build Complete
        run: |
          echo "=============================================="
          echo "          RYTHEME DOCKER SUCCESS"
          echo "=============================================="
          echo "🐳 Docker image built"
          echo "📦 Image pushed to GHCR"
          echo "🏷️ Tags generated successfully"
          echo "=============================================="


      # ----------------------------------------------------------------------
      # RENDER DEPLOYMENT
      # ----------------------------------------------------------------------

      - name: 📡 Trigger Render Deployment
        if: ${{ secrets.RENDER_DEPLOY_HOOK != '' }}

        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}

        run: |
          echo "🚀 Triggering Render deployment..."

          curl \
            --fail \
            --silent \
            --show-error \
            --request POST \
            "$RENDER_DEPLOY_HOOK"

          echo "✅ Render deployment triggered successfully."


  # ==========================================================================
  # JOB 3 — PRODUCTION HEALTH CHECK
  # ==========================================================================

  health-check:

    name: ❤️ Production Health Check

    needs: deploy-docker

    if: >
      github.event_name == 'push' &&
      (
        github.ref == 'refs/heads/main' ||
        github.ref == 'refs/heads/master'
      )

    runs-on: ubuntu-latest

    steps:

      # ----------------------------------------------------------------------
      # WAIT FOR RENDER
      # ----------------------------------------------------------------------

      - name: ⏳ Wait for Render Deployment
        run: |
          echo "Waiting for Render deployment..."
          sleep 30


      # ----------------------------------------------------------------------
      # HEALTH CHECK
      # ----------------------------------------------------------------------

      - name: ❤️ Check Production API
        if: ${{ secrets.PRODUCTION_HEALTH_URL != '' }}

        env:
          PRODUCTION_HEALTH_URL: ${{ secrets.PRODUCTION_HEALTH_URL }}

        run: |
          echo "🔎 Checking RYTHEME production API..."

          curl \
            --fail \
            --silent \
            --show-error \
            --max-time 30 \
            "$PRODUCTION_HEALTH_URL"

          echo ""
          echo "✅ Production API is healthy."


      # ----------------------------------------------------------------------
      # HEALTH CHECK SKIPPED
      # ----------------------------------------------------------------------

      - name: ⚠️ Health Check Not Configured
        if: ${{ secrets.PRODUCTION_HEALTH_URL == '' }}

        run: |
          echo "⚠️ PRODUCTION_HEALTH_URL is not configured."
          echo "Skipping production health check."


  # ==========================================================================
  # JOB 4 — FINAL DEPLOYMENT STATUS
  # ==========================================================================

  deployment-success:

    name: 🎉 RYTHEME Deployment Complete

    needs:
      - build-and-test
      - deploy-docker
      - health-check

    if: success()

    runs-on: ubuntu-latest

    steps:

      - name: 🎉 Deployment Success
        run: |
          echo ""
          echo "=============================================="
          echo "          🎵 RYTHEME IS LIVE 🎵"
          echo "=============================================="
          echo ""
          echo "✅ Flutter Web validated"
          echo "✅ Flutter Web built"
          echo "✅ JioSaavn API validated"
          echo "✅ Express Backend validated"
          echo "✅ Docker image built"
          echo "✅ Docker image pushed to GHCR"
          echo "✅ Render deployment triggered"
          echo "✅ Production health check completed"
          echo ""
          echo "🚀 RYTHEME CI/CD PIPELINE SUCCESSFUL"
          echo ""
          echo "=============================================="
```
